<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="basic-title"></html:h2></label>
  <checkbox
    id="__addonRef__-enableBionicReader"
    preference="__prefsPrefix__.enableBionicReader"
    data-l10n-id="enableBionicReader"
    native="true"
  />
  <checkbox
    id="__addonRef__-enableReaderToolbarButton"
    preference="__prefsPrefix__.enableReaderToolbarButton"
    data-l10n-id="enableReaderToolbarButton"
    native="true"
    oncommand="Zotero.__addonInstance__.hooks.onShowRestartDialog()"
  />
  <hbox align="center">
    <html:label
      data-l10n-id="disableForLanguages"
      for="__addonRef__-disableForLanguages"
    ></html:label>
    <html:input
      id="__addonRef__-disableForLanguages"
      preference="__prefsPrefix__.disableForLanguages"
      data-l10n-id="disableForLanguagesInput"
      type="text"
    ></html:input>
  </hbox>
</groupbox>
<groupbox id="__addonRef__-parsing">
  <label><html:h2 data-l10n-id="parsing-title"></html:h2></label>
  <hbox align="center">
    <html:label
      data-l10n-id="opacityContrast"
      for="__addonRef__-opacityContrast"
    ></html:label>
    <html:input
      id="__addonRef__-opacityContrast"
      preference="__prefsPrefix__.opacityContrast"
      type="number"
      min="1"
      max="5"
      step="1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="weightContrast"
      for="__addonRef__-weightContrast"
    ></html:label>
    <html:input
      id="__addonRef__-weightContrast"
      preference="__prefsPrefix__.weightContrast"
      type="number"
      min="1"
      max="5"
      step="1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="weightOffset"
      for="__addonRef__-weightOffset"
    ></html:label>
    <html:input
      id="__addonRef__-weightOffset"
      preference="__prefsPrefix__.weightOffset"
      type="number"
      min="-3"
      max="3"
      step="1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="parsingOffset"
      for="__addonRef__-parsingOffset"
    ></html:label>
    <html:input
      id="__addonRef__-parsingOffset"
      preference="__prefsPrefix__.parsingOffset"
      type="number"
      min="-5"
      max="5"
      step="1"
    ></html:input>
  </hbox>
  <vbox no-highlight="true">
    <html:div id="__addonRef__-parsingPreview"
      >Zotero is a free, easy-to-use tool to help you collect, organize,
      annotate, cite, and share research.</html:div
    >
    <hbox id="__addonRef__-parsingPreviewWarning" align="center">
      <html:img src="chrome://zotero/skin/20/universal/error.svg"></html:img>
      <html:div data-l10n-id="parsingPreviewWarning"></html:div>
    </hbox>
  </vbox>
</groupbox>
<groupbox id="__addonRef__-colorful">
  <label><html:h2 data-l10n-id="colorful-title"></html:h2></label>
  <checkbox
    id="__addonRef__-enableColorful"
    preference="__prefsPrefix__.enableColorful"
    data-l10n-id="enableColorful"
    native="true"
  />
  <hbox align="center">
    <html:label
      data-l10n-id="colorMode"
      for="__addonRef__-colorMode"
    ></html:label>
    <html:select
      id="__addonRef__-colorMode"
      preference="__prefsPrefix__.colorMode"
    >
      <html:option value="rainbow" data-l10n-id="colorMode-rainbow"></html:option>
      <html:option value="solid" data-l10n-id="colorMode-solid"></html:option>
      <html:option value="alternating" data-l10n-id="colorMode-alternating"></html:option>
      <html:option value="wordpos" data-l10n-id="colorMode-wordpos"></html:option>
      <html:option value="custom" data-l10n-id="colorMode-custom"></html:option>
    </html:select>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="colorPalette"
      for="__addonRef__-colorPalette"
    ></html:label>
    <html:select
      id="__addonRef__-colorPalette"
      preference="__prefsPrefix__.colorPalette"
    >
      <html:option value="default" data-l10n-id="colorPalette-default"></html:option>
      <html:option value="pastel" data-l10n-id="colorPalette-pastel"></html:option>
      <html:option value="vivid" data-l10n-id="colorPalette-vivid"></html:option>
      <html:option value="mono" data-l10n-id="colorPalette-mono"></html:option>
    </html:select>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="colorOpacity"
      for="__addonRef__-colorOpacity"
    ></html:label>
    <html:input
      id="__addonRef__-colorOpacity"
      preference="__prefsPrefix__.colorOpacity"
      type="number"
      min="0.1"
      max="1"
      step="0.1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="colorSaturation"
      for="__addonRef__-colorSaturation"
    ></html:label>
    <html:input
      id="__addonRef__-colorSaturation"
      preference="__prefsPrefix__.colorSaturation"
      type="number"
      min="0"
      max="2"
      step="0.1"
    ></html:input>
  </hbox>
  <hbox id="__addonRef__-customColorRow" align="center">
    <html:label
      data-l10n-id="customColorsPickerTitle"
      style="min-width: 110px"
    ></html:label>
    <hbox id="__addonRef__-customColorPickers" align="center">
      <html:input
        id="__addonRef__-customColor1"
        type="color"
        value="#c13b8c"
      />
      <html:input
        id="__addonRef__-customColor2"
        type="color"
        value="#4a7fd6"
      />
      <html:input
        id="__addonRef__-customColor3"
        type="color"
        value="#2f9e6d"
      />
    </hbox>
  </hbox>
  <hbox id="__addonRef__-customColorJsonRow" align="center" style="display: none">
    <html:label
      data-l10n-id="customColors"
      for="__addonRef__-customColors"
    ></html:label>
    <html:input
      id="__addonRef__-customColors"
      preference="__prefsPrefix__.customColors"
      data-l10n-id="customColorsInput"
      type="text"
    ></html:input>
  </hbox>
  <hbox
    id="__addonRef__-customColorsWarning"
    align="center"
    style="display: none"
  >
    <html:img src="chrome://zotero/skin/20/universal/error.svg"></html:img>
    <html:div data-l10n-id="customColorsInvalid"></html:div>
  </hbox>
</groupbox>
<vbox id="__addonRef__-pluginInfo">
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
